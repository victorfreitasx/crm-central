# Deploy do placar. na Cloudflare.
# Requer o secret CLOUDFLARE_API_TOKEN no repositório
# (Settings → Secrets and variables → Actions), com permissões:
# Workers Scripts: Edit · D1: Edit · Workers KV Storage: Edit.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_demo:
        description: 'popular dados de demonstração?'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: provisiona e implanta (D1 + KV + Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_DEMO: ${{ inputs.seed_demo && '1' || '0' }}
        run: bash scripts/provision.sh
