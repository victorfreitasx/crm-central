<link rel="stylesheet" href="/ds/base.css">
<style>
  html, body { margin:0; padding:0; height:100%; background:#FBF4E9; }
  * { box-sizing:border-box; }
  ::selection { background:#CBFB45; color:#151210; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#B7AEA6; border-radius:99px; border:2px solid #FBF4E9; }
  ::-webkit-scrollbar-track { background:transparent; }
  @keyframes plToast { from { transform:translateY(14px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes plPop { from { transform:scale(0.96); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes plSpin { to { transform:rotate(360deg); } }
  input[type="date"] { font-family:"Space Mono", monospace; }
  input::placeholder, textarea::placeholder { color:#B7AEA6; }
  .pl-hover-row:hover { background:var(--paper-50); }
  .pl-hover-ink:hover { border-color:var(--ink-900) !important; color:var(--ink-900) !important; }
  .pl-btn { transition: box-shadow 120ms var(--ease-snap), transform 120ms var(--ease-snap); cursor:pointer; user-select:none; }
  .pl-btn:active { transform:translate(2px,2px); box-shadow:0 0 0 0 var(--ink-900) !important; }
  body { font-family:var(--font-sans); color:var(--ink-900); }
</style>
</head>
